titulo: A KeepTrack
subtitulo: Uma empresa de expedições, treinamentos e eventos off-road que trata segurança como parte do roteiro.
capa: https://www.keeptrack.com.br/wp/wp-content/uploads/2021/12/keeptrack-quem-somos.jpg
capaAlt: Veículos da KeepTrack estacionados em trilha de terra
historia: |
  A KeepTrack nasceu da estrada. Antes de virar empresa, eram viagens de 4x4 por trilhas do interior paulista, depois pelo Brasil e, com o tempo, pela América do Sul. Em cada uma ficou claro que a diferença entre uma boa aventura e um problema sério está no preparo: saber usar o carro, levar o equipamento certo e ter alguém que conhece o caminho.

  Hoje a KeepTrack organiza treinamentos de técnicas de condução 4x4 em pista off-road no Raceville Speed Club, em Brotas-SP, e expedições guiadas para destinos como Jalapão, Serra da Canastra, Pantanal e Estrada Real. Também atende empresas com treinamentos e eventos corporativos, orienta sobre acessórios e equipamentos e presta consultoria de manutenção e preparação de veículos 4x4.
servicos:
  - titulo: Treinamentos 4x4
    texto: Técnicas de condução fora de estrada para iniciantes e experientes, em grupo, personalizado ou para empresas.
  - titulo: Viagens e expedições
    texto: Roteiros off-road guiados pelo Brasil e pela América do Sul, com carro de apoio e equipe experiente.
  - titulo: Eventos corporativos
    texto: Experiências off-road e treinamentos de direção para equipes e clientes da sua empresa.
  - titulo: Consultoria e preparação
    texto: Orientação sobre acessórios, equipamentos, manutenção e preparação do seu 4x4 para viagem.
